<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOC Screen Suite</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style>
/* Every BOC screen on one page. Each phone is the live app opened read-only (?shot=1) at that screen. */
:root{--jet:#00262B;--mint:#ABFFAE;--ground:#F2F1EE;--card:#fff;--line:#DADCD6;--ink:#0B1F22;--ink2:#566366}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--jet);color:#fff;padding:14px max(16px,3vw);display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
header h1{margin:0;font-size:20px;font-weight:400;letter-spacing:-.01em}
header h1 b{color:var(--mint);font-weight:600}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav a{color:#C9DADC;text-decoration:none;padding:6px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.15);font-size:13px}
nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.ctl{margin-left:auto;display:flex;gap:6px;align-items:center;color:#C9DADC;font-size:13px}
.ctl button{font:inherit;padding:6px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:none;color:#fff;cursor:pointer}
.ctl button.on{background:var(--mint);color:var(--jet);border-color:var(--mint)}
main{padding:8px max(16px,3vw) 60px}
section{margin-top:28px}
section>h2{font-size:26px;font-weight:300;letter-spacing:-.02em;margin:0 0 4px}
section>p{margin:0 0 16px;color:var(--ink2);max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px 20px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(620px,1fr))}
figure{margin:0}
figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
figcaption b{font-weight:500}
figcaption a{color:var(--ink2);font-size:12.5px}
.frame{position:relative;width:300px;height:620px;border-radius:34px;background:#0B1416;padding:8px;box-shadow:0 18px 40px -24px rgba(0,30,34,.5)}
.frame iframe{border:0;width:390px;height:804px;transform:scale(.7334);transform-origin:0 0;border-radius:36px;background:#fff}
.frame .cl{position:absolute;inset:8px;overflow:hidden;border-radius:26px}
.wide .frame{width:100%;height:420px;border-radius:12px;padding:0;background:var(--card);border:1px solid var(--line);box-shadow:none}
.wide .frame .cl{inset:0;border-radius:12px}
.wide .frame iframe{width:1280px;height:840px;transform:scale(.5);border-radius:0}
@media (max-width:700px){.grid.wide{grid-template-columns:1fr}.wide .frame iframe{transform:scale(.27)}.wide .frame{height:230px}}
</style>
</head>
<body>
<header><h1><b>BOC</b> · every screen at once</h1>
<nav id="toc"></nav>
<div class="ctl">Phone<button data-os="android" class="on">Android</button><button data-os="ios">iPhone</button></div></header>
<main id="main"></main>
<script>
const G=[
 {id:"owner",t:"Business owner",d:"Shree Textiles, a Coimbatore fabric wholesaler that also sells to shoppers.",s:[
  ["Chats","view=owner&tab=chats"],["Pending","view=owner&tab=pending"],["Business home","view=owner&tab=biz"],["More","view=owner&tab=more"],
  ["Contacts and CRM","view=owner&screen=customers"],["Contact record","view=owner&screen=contact&id=c2"],["Labels","view=owner&screen=customers&sheet=labels"],
  ["Retail chat: Meera","view=owner&chat=c1"],["Wholesale on credit","view=owner&chat=c10"],["Quote and invoice","view=owner&chat=c2"],["Contract to sign","view=owner&chat=c7"],
  ["Buy from a manufacturer","view=owner&chat=c11"],["Products","view=owner&screen=catalog"],["Orders","view=owner&screen=orders"],["Money","view=owner&screen=money"],
  ["Credit and dues","view=owner&screen=credit"],["Purchases","view=owner&screen=purchases"],["Plan and billing","view=owner&screen=plan"],["AI assistant","view=owner&screen=assistant"],
  ["Broadcasts","view=owner&screen=broadcast"],["Team","view=owner&screen=team"],["Verification","view=owner&screen=verification"]]},
 {id:"staff",t:"Staff (Ravi)",d:"Same business, a sales role: discounts above 10% wait for the owner.",s:[["Chats","view=staff&tab=chats"],["Wholesale chat","view=staff&chat=c2"],["Pending","view=staff&tab=pending"]]},
 {id:"customer",t:"Customer (Meera)",d:"A personal account buying from every kind of business.",s:[
  ["Chats","view=customer&tab=chats"],["Explore","view=customer&tab=explore"],["Orders","view=customer&tab=orders"],["You","view=customer&tab=me"],
  ["Saree shop","view=customer&chat=c1"],["Unverified seller","view=customer&chat=x1"],["Salon booking","view=customer&chat=y1"],["Interior project","view=customer&chat=y2"],
  ["Milk subscription","view=customer&chat=y3"],["Tent rental","view=customer&chat=y4"],["Pharmacy batches","view=customer&chat=x2"],["Business profile","view=customer&screen=bizprofile&id=st"]]},
 {id:"web",t:"Public web page",d:"What anyone sees from a business's number or QR code, without the app.",s:[["Shree Textiles","frame=web&web=st"],["Glow Studio Salon","frame=web&web=gs"],["Rajputana Tent House","frame=web&web=tt"],["Unverified store","frame=web&web=qd"]]},
 {id:"signup",t:"Sign-up",d:"Phone and OTP, then personal or business; businesses verify GST, KYC and bank.",s:[["Welcome","ob=welcome"],["Phone","ob=phone"],["Account type","ob=type"],["Business details","ob=b1"],["Verify business","ob=b2"],["Bank account","ob=b3"],["Shop setup","ob=b4"]]},
 {id:"admin",t:"BOC admin console",d:"For the BOC team. Each role sees only its sections.",wide:true,s:[
  ["Users","section=users"],["Verification queue","section=verify"],["Support tickets","section=support"],["Disputes","section=disputes"],["Features and limits","section=features"],
  ["Plans and billing","section=billing"],["Ads","section=ads"],["Broadcasts","section=broadcast"],["Money","section=money"],["Fraud flags","section=fraud"],
  ["Catalog moderation","section=moderation"],["Reports","section=reports"],["Legal requests","section=legal"],["Audit log","section=audit"],["Admin roles","section=team"]]}
];
let os="android";
function url(g,q){return g.id==="admin"?`admin.html?${q}`:`index.html?shot=1&os=${os}&${q}`}
function draw(){
  document.getElementById("toc").innerHTML=G.map(g=>`<a href="#${g.id}">${g.t}</a>`).join("");
  document.getElementById("main").innerHTML=G.map(g=>`<section id="${g.id}"><h2>${g.t}</h2><p>${g.d}</p><div class="grid ${g.wide?"wide":""}">${g.s.map(([t,q])=>`<figure><figcaption><b>${t}</b><a href="${url(g,q).replace("shot=1&","")}" target="_blank" rel="noopener">Open</a></figcaption><div class="frame"><div class="cl"><iframe loading="lazy" title="${t}" src="${url(g,q)}"></iframe></div></div></figure>`).join("")}</div></section>`).join("")}
document.querySelector(".ctl").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;os=b.dataset.os;document.querySelectorAll(".ctl button").forEach(x=>x.classList.toggle("on",x===b));draw()});
draw();
</script>
</body>
</html>
